name: Apply iPhone banner placement

on:
  push:
    branches:
      - chatgpt/trigger-iphone-banner-final

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move open-day banner on iPhone only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8-sig')

          css_anchor = '''    .open-banner.visible {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
'''
          css_replacement = css_anchor + '''
    .open-banner.iphone-inline {
      margin: 0;
    }
'''
          if '.open-banner.iphone-inline' not in text:
              if css_anchor not in text:
                  raise SystemExit('CSS anchor not found')
              text = text.replace(css_anchor, css_replacement, 1)

          quick_anchor = '<div class="quick-grid">'
          if 'id="quickGrid"' not in text:
              if quick_anchor not in text:
                  raise SystemExit('quick-grid anchor not found')
              text = text.replace(quick_anchor, '<div class="quick-grid" id="quickGrid">', 1)

          js_anchor = '''    const openBanner = document.getElementById("openBanner");
'''
          js_replacement = js_anchor + '''    const quickGrid = document.getElementById("quickGrid");
    const tableWrap = document.getElementById("tableWrap");

    function placeOpenBannerForDevice() {
      const isIPhone = /iPhone/i.test(navigator.userAgent);
      if (isIPhone && quickGrid) {
        quickGrid.insertAdjacentElement("afterend", openBanner);
        openBanner.classList.add("iphone-inline");
      } else if (tableWrap) {
        tableWrap.insertAdjacentElement("beforebegin", openBanner);
        openBanner.classList.remove("iphone-inline");
      }
    }

    placeOpenBannerForDevice();
'''
          if 'function placeOpenBannerForDevice()' not in text:
              if js_anchor not in text:
                  raise SystemExit('JS anchor not found')
              text = text.replace(js_anchor, js_replacement, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-iphone-banner-final.yml

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html .github/workflows/apply-iphone-banner-final.yml
          git commit -m "iPhone: show open workday below quick buttons"
          git push origin HEAD:main
