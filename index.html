<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#176b87" />
  <title>Zeiterfassung</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f4f6f8; }
  </style>
</head>
<body>
<script>
(async function () {
  try {
    const response = await fetch('app-original.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('App konnte nicht geladen werden.');
    let html = await response.text();

    const iphonePatch = `<script>
(function () {
  function moveOpenBannerOnIPhone() {
    if (!/iPhone/i.test(navigator.userAgent)) return;
    var banner = document.getElementById('openBanner');
    var quickGrid = document.querySelector('.quick-grid');
    if (banner && quickGrid) {
      quickGrid.insertAdjacentElement('afterend', banner);
      banner.style.margin = '0';
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', moveOpenBannerOnIPhone);
  } else {
    moveOpenBannerOnIPhone();
  }
})();
<\/script>`;

    html = html.replace('</body>', iphonePatch + '</body>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<p style="font-family:system-ui;padding:24px">Zeiterfassung konnte nicht geladen werden. Bitte Seite neu laden.</p>';
  }
})();
</script>
</body>
</html>
